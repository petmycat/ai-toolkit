# gen2.optimizer is the only optimizer configuration; eps is deliberately 1e-8.
# named_phrase is EVALUATION ONLY. Set it to null for an unnamed-style experiment.
# Sampling is independent of saves. Retention is one rolling resume checkpoint plus final export.
